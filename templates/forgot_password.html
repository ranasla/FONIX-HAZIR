<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a14 0%, #12121f 50%, #0d1520 100%);
            color: #f5f5ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .card {
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            font-family: 'Times New Roman', Georgia, serif;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .logo .f { color: #4AADE8; }
        .logo .on { color: #1a1a2e; }
        .logo .ix { color: #E63946; }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .icon-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .icon-section .icon {
            font-size: 60px;
            margin-bottom: 16px;
        }

        h2 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #aaa;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff146a;
            background: rgba(255, 20, 106, 0.05);
            box-shadow: 0 0 0 3px rgba(255, 20, 106, 0.1);
        }

        .form-group input::placeholder {
            color: #555;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff146a, #ff7ab8);
            color: white;
            margin-bottom: 16px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 20, 106, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #aaa;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #ff7ab8;
        }

        /* Floating notes animation */
        .floating-notes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .note {
            position: absolute;
            font-size: 24px;
            opacity: 0.1;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.1; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
    </style>
</head>

<body>
    <div class="floating-notes">
        <span class="note" style="left: 10%; animation-delay: 0s;">♪</span>
        <span class="note" style="left: 20%; animation-delay: 2s;">♫</span>
        <span class="note" style="left: 30%; animation-delay: 4s;">🎵</span>
        <span class="note" style="left: 50%; animation-delay: 1s;">♬</span>
        <span class="note" style="left: 70%; animation-delay: 3s;">🎶</span>
        <span class="note" style="left: 85%; animation-delay: 5s;">♪</span>
    </div>

    <div class="container">
        <div class="card">
            <div class="logo">
                <span class="f">F</span><span class="on">ON</span><span class="ix">IX</span>
            </div>
            <p class="subtitle">Müziğin geleceği</p>

            <div class="icon-section">
                <div class="icon">🔐</div>
            </div>

            <h2>Şifreni Sıfırla</h2>
            <p class="description">E-posta adresini gir ve yeni şifreni belirle.</p>

            {% if error %}
            <div class="alert alert-error">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            {% if message %}
            <div class="alert alert-success">
                ✅ {{ message }}
            </div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label>📧 E-posta Adresi</label>
                    <input type="email" name="email" placeholder="ornek@email.com" required>
                </div>

                <div class="form-group">
                    <label>🔑 Yeni Şifre</label>
                    <input type="password" name="new_password" placeholder="En az 6 karakter" required minlength="6">
                </div>

                <div class="form-group">
                    <label>🔑 Yeni Şifre (Tekrar)</label>
                    <input type="password" name="confirm_password" placeholder="Şifreyi tekrar gir" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary">
                    🔄 Şifremi Güncelle
                </button>
            </form>

            <a href="{{ url_for('login') }}" class="back-link">
                ← Giriş sayfasına dön
            </a>
        </div>
    </div>
</body>

</html>
