<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            color: #f5f5ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .floating-notes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .note {
            position: absolute;
            font-size: 24px;
            opacity: 0.08;
            animation: floatNote linear infinite;
        }

        @keyframes floatNote {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.1;
            }
            90% {
                opacity: 0.1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .register-card {
            background: rgba(30, 30, 50, 0.8);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-text {
            font-family: 'Times New Roman', Georgia, serif;
            font-size: 42px;
            font-weight: bold;
            display: inline-block;
        }

        .logo-text .f { color: #4AADE8; }
        .logo-text .on { color: #1a1a2e; }
        .logo-text .ix { color: #E63946; }

        .register-card h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .register-card .subtitle {
            color: #888;
            font-size: 14px;
            text-align: center;
            margin-bottom: 28px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group.full {
            grid-column: span 2;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ccc;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: rgba(255, 122, 184, 0.5);
            box-shadow: 0 0 20px rgba(255, 122, 184, 0.1);
        }

        .form-group input::placeholder {
            color: #555;
        }

        .password-strength {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            background: #ff146a;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .password-hint {
            font-size: 11px;
            color: #666;
            margin-top: 6px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #888;
        }

        .terms input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #ff146a;
            margin-top: 2px;
        }

        .terms a {
            color: #ff7ab8;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff146a, #ff7ab8);
            color: #fff;
            box-shadow: 0 8px 30px rgba(255, 20, 106, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255, 20, 106, 0.4);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #555;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 16px;
        }

        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-btn svg {
            flex-shrink: 0;
        }

        .social-btn span {
            font-weight: 500;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .social-btn.google:hover {
            border-color: #4285F4;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.3);
        }

        .social-btn.apple:hover {
            border-color: #fff;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        .social-btn.spotify:hover {
            border-color: #1DB954;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #888;
        }

        .login-link a {
            color: #ff7ab8;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.15);
            border: 1px solid rgba(220, 53, 69, 0.3);
            color: #ff6b7a;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-link {
            position: absolute;
            top: -50px;
            left: 0;
            color: #888;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: #ff7ab8;
        }

        @media (max-width: 500px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-group.full {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>
    <div class="floating-notes" id="floatingNotes"></div>

    <div class="register-container">
        <a href="{{ url_for('index') }}" class="back-link">← Ana Sayfa</a>

        <div class="register-card">
            <div class="logo">
                <div class="logo-text"><span class="f">F</span><span class="on">ON</span><span class="ix">IX</span></div>
            </div>

            <h2>Hesap Oluştur 🚀</h2>
            <p class="subtitle">Ücretsiz kayıt ol ve müzik yolculuğuna başla</p>

            {% if error %}
            <div class="error-message">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label>Ad Soyad</label>
                        <input type="text" name="full_name" placeholder="John Doe">
                    </div>

                    <div class="form-group">
                        <label>Kullanıcı Adı *</label>
                        <input type="text" name="username" placeholder="johndoe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>E-posta Adresi *</label>
                    <input type="email" name="email" placeholder="john@example.com" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Şifre *</label>
                        <input type="password" name="password" id="password" placeholder="••••••••" required
                            oninput="checkPasswordStrength(this.value)">
                        <div class="password-strength">
                            <div class="password-strength-bar" id="strengthBar"></div>
                        </div>
                        <p class="password-hint">En az 6 karakter</p>
                    </div>

                    <div class="form-group">
                        <label>Şifre Tekrar *</label>
                        <input type="password" name="confirm" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="terms">
                    <input type="checkbox" required>
                    <span>
                        <a href="#">Kullanım Şartları</a>'nı ve
                        <a href="#">Gizlilik Politikası</a>'nı okudum ve kabul ediyorum.
                    </span>
                </div>

                <button type="submit" class="btn btn-primary">
                    ✨ Kayıt Ol
                </button>
            </form>

            <div class="divider">
                <span>veya</span>
            </div>

            <div class="social-buttons">
                <button class="social-btn google" title="Google ile Kayıt">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>Google</span>
                </button>
                <button class="social-btn apple" title="Apple ile Kayıt">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                    </svg>
                    <span>Apple</span>
                </button>
                <button class="social-btn spotify" title="Spotify ile Kayıt">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#1DB954">
                        <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
                    </svg>
                    <span>Spotify</span>
                </button>
            </div>

            <div class="login-link">
                Zaten hesabın var mı? <a href="{{ url_for('login') }}">Giriş Yap</a>
            </div>
        </div>
    </div>

    <script>
        function checkPasswordStrength(password) {
            const bar = document.getElementById('strengthBar');
            let strength = 0;

            if (password.length >= 6) strength += 25;
            if (password.length >= 10) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password)) strength += 25;

            bar.style.width = strength + '%';

            if (strength <= 25) bar.style.background = '#dc3545';
            else if (strength <= 50) bar.style.background = '#ffc107';
            else if (strength <= 75) bar.style.background = '#17a2b8';
            else bar.style.background = '#28a745';
        }

        const notes = ['♪', '♫', '♬', '🎵', '🎶'];
        const container = document.getElementById('floatingNotes');

        function createNote() {
            const note = document.createElement('div');
            note.className = 'note';
            note.textContent = notes[Math.floor(Math.random() * notes.length)];
            note.style.left = Math.random() * 100 + '%';
            note.style.animationDuration = (15 + Math.random() * 20) + 's';
            container.appendChild(note);
            setTimeout(() => note.remove(), 35000);
        }

        for (let i = 0; i < 15; i++) setTimeout(createNote, i * 300);
        setInterval(createNote, 2000);
    </script>
</body>

</html>
